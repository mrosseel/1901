name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # Fails the build when a known vuln is reachable from our code, as
      # the stdlib CVEs of August 2026 were.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      # A release compiles this dist into the binary (ADR-051), and nothing
      # else builds with the tag, so a broken embed would otherwise first show
      # up in a release. That is the worst place to find one, and it did
      # happen: the placements directory left with the authoring tools and
      # took the release build with it.
      #
      # The build runs, the binary is thrown away. Proving the tagged build
      # still links is worth a minute; keeping a 40 MB artifact from every
      # push is not, and making a release is a button somebody presses.
      #
      # It sits in this job rather than beside the other Go steps because the
      # embed needs the web/dist that `npm run build` above has just made.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build -tags standalone -o /dev/null .
        working-directory: ${{ github.workspace }}

  datc:
    name: DATC compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # godip's own test suite carries the DATC corpus plus a decade of
      # regression files from real games; running it here is our compliance
      # statement until the dedicated report page lands.
      - run: go test github.com/zond/godip/... 2>&1 | tee datc-results.txt
      # The same corpus, adjudicated on the classical board this server loads
      # from variants/generated. godip's run proves the adjudicator; this one
      # proves the descriptor the adjudicator is handed.
      - run: go test -run TestDATCOnTheLoadedClassicalBoard -v . 2>&1 | tee -a datc-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: datc-results
          path: datc-results.txt
