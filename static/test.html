<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>app.js harness (not part of the UI)</title>
<link rel="stylesheet" href="/static/app.css">
<script>
/*
Offline harness. It replaces fetch() with canned /map.svg, /state, /options and
/order responses, then drives one order through the real UI code. Open it and
read #results; window.__results holds the same data for a headless driver.
It is a development aid and is not linked from index.html.
*/
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason)));

const MAP = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1524 1357" width="100%" height="100%">
  <g id="provinces" style="display:none;opacity:1">
    <path id="vie" d="M 700,800 h 60 v 60 h -60 z"/>
    <path id="tri" d="M 700,900 h 60 v 60 h -60 z"/>
    <path id="bud" d="M 800,800 h 60 v 60 h -60 z"/>
    <path id="ser" d="M 800,900 h 60 v 60 h -60 z"/>
    <path id="gal" d="M 900,800 h 60 v 60 h -60 z"/>
    <path id="tri/xc" d="M 900,900 h 20 v 20 h -20 z"/>
  </g>
  <g id="supply-centers" style="display:none">
    <path id="vieCenter" d="m 730,830 h 10 v 10 h -10 z"/>
    <path id="triCenter" d="m 730,930 h 10 v 10 h -10 z"/>
    <path id="budCenter" d="m 830,830 h 10 v 10 h -10 z"/>
  </g>
  <g id="province-centers" style="display:none">
    <path id="serCenter" d="m 830,930 h 10 v 10 h -10 z"/>
    <path id="galCenter" d="m 930,830 h 10 v 10 h -10 z"/>
  </g>
  <g id="units"/>
</svg>`;

let STATE = {
  phase: { season: "Spring", year: 1901, type: "Movement" },
  units: {
    vie: { type: "Army", nation: "Austria" },
    bud: { type: "Army", nation: "Austria" },
    tri: { type: "Fleet", nation: "Austria" },
  },
  orders: {},
  orderParts: {},
  resolutions: {},
};

// Shaped exactly like godip's Options JSON, with the province branch on top.
const OPTIONS = {
  vie: {
    Type: "Province",
    Next: {
      Hold: { Type: "OrderType", Next: { vie: { Type: "SrcProvince", Next: {} } } },
      Move: {
        Type: "OrderType",
        Next: {
          vie: {
            Type: "SrcProvince",
            Next: {
              tri: { Type: "Province", Next: {} },
              bud: { Type: "Province", Next: {} },
              gal: { Type: "Province", Next: {} },   // empty: a plain move target
            },
          },
        },
      },
      Support: {
        Type: "OrderType",
        Next: {
          vie: {
            Type: "SrcProvince",
            Next: {
              bud: {
                Type: "Province",
                Next: { ser: { Type: "Province", Next: {} }, bud: { Type: "Province", Next: {} } },
              },
            },
          },
        },
      },
    },
  },
};

window.__calls = [];

// Lets the harness put a board together without going through the UI.
window.__setOrder = (province, parts) => {
  STATE = Object.assign({}, STATE, {
    orders: Object.assign({}, STATE.orders, { [province]: parts.join(" ") }),
    orderParts: Object.assign({}, STATE.orderParts, { [province]: parts }),
  });
};

window.fetch = async function (url, opts) {
  // app.js addresses endpoints relative to the page, so match on the tail.
  const path = "/" + new URL(String(url), location.href).pathname.split("/").pop() +
    (String(url).includes("?") ? "?" + String(url).split("?")[1] : "");
  window.__calls.push({ url: path, body: opts && opts.body ? JSON.parse(opts.body) : null });
  const ok = (payload, text) => ({
    ok: true,
    status: 200,
    text: async () => (text === undefined ? JSON.stringify(payload) : text),
    json: async () => payload,
  });
  if (path === "/map.svg") return ok(null, MAP);
  if (path === "/state") return ok(STATE);
  if (path.startsWith("/options")) {
    const province = new URLSearchParams(path.split("?")[1]).get("province");
    return ok(OPTIONS[province] ? { [province]: OPTIONS[province] } : {});
  }
  if (path === "/order") {
    const body = JSON.parse(opts.body);
    const orders = Object.assign({}, STATE.orders);
    const orderParts = Object.assign({}, STATE.orderParts);
    if (body.parts.length === 0) {           // an empty list cancels
      delete orders[body.province];
      delete orderParts[body.province];
    } else {
      orders[body.province] = body.parts.join(" ");
      orderParts[body.province] = body.parts;
    }
    STATE = Object.assign({}, STATE, { orders, orderParts });
    return ok(STATE);
  }
  if (path === "/adjudicate") {
    STATE = Object.assign({}, STATE, { orders: {}, orderParts: {}, resolutions: { vie: "OK" } });
    return ok(STATE);
  }
  return { ok: false, status: 404, text: async () => "no stub", json: async () => ({}) };
};
</script>
</head>
<body>
<div id="layout">
  <main id="map-pane"><div id="map"></div></main>
  <aside id="sidebar">
    <header id="phase-bar">
      <h1 id="phase">Loading…</h1>
      <button id="adjudicate" type="button" disabled>Adjudicate</button>
    </header>
    <section id="builder" hidden>
      <div id="builder-head">
        <h2 id="builder-title"></h2>
        <button id="builder-cancel" type="button" class="link">Cancel</button>
      </div>
      <p id="builder-path" class="crumbs"></p>
      <div id="builder-buttons" class="buttons"></div>
    </section>
    <section id="orders-pane"><h2>Orders</h2><ul id="orders" class="list"></ul></section>
    <section id="resolutions-pane" hidden><h2>Resolutions</h2><ul id="resolutions" class="list"></ul></section>
    <p id="status"></p>
  </aside>
</div>
<pre id="results">running…</pre>

<script src="/static/app.js"></script>
<script>
const checks = [];
function check(name, pass, detail) {
  checks.push((pass ? "PASS " : "FAIL ") + name + (detail ? " — " + detail : ""));
}

function wait(test, label) {
  return new Promise((resolve, reject) => {
    const deadline = Date.now() + 3000;
    (function poll() {
      if (test()) return resolve();
      if (Date.now() > deadline) return reject(new Error("timeout waiting for " + label));
      setTimeout(poll, 20);
    })();
  });
}

function buttonNamed(text) {
  return Array.from(document.querySelectorAll("#builder-buttons button")).find(
    (b) => b.textContent.trim().toUpperCase() === text.toUpperCase()
  );
}

async function run() {
  await wait(() => document.querySelector("#unit-overlay"), "unit overlay");
  const marks = document.querySelectorAll("#unit-overlay .unit");
  check("units drawn", marks.length === 3, marks.length + " markers");
  check("fleet is a triangle", document.querySelector("#unit-overlay polygon.unit") !== null);
  check("centers parsed", window.__app.centers.size === 5, "size " + window.__app.centers.size);
  check("phase rendered", document.getElementById("phase").textContent === "Spring 1901 Movement");

  // Click the province through the real map handler.
  document.querySelector("#provinces #vie").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => !document.getElementById("builder").hidden, "builder panel");
  const types = Array.from(document.querySelectorAll("#builder-buttons button")).map((b) => b.textContent);
  check("root Province node skipped", types.join(",") === "Hold,Move,Support", types.join(","));

  // Move is pre-selected: the targets are highlighted with no button press.
  const preLegal = Array.from(document.querySelectorAll("#provinces .legal")).map((e) => e.id).sort();
  check("move targets highlighted at once", preLegal.join(",") === "bud,gal,tri", preLegal.join(","));
  check("selection hint names the unit and province",
        document.getElementById("status").textContent ===
          "Army Vienna: tap a green province to move there. Occupied = attack or support. Double-tap Vienna to hold.",
        document.getElementById("status").textContent);
  check("an occupied target is marked apart from an empty one",
        document.querySelector("#provinces #bud").classList.contains("occupied") &&
        !document.querySelector("#provinces #gal").classList.contains("occupied"));
  check("source highlighted", document.querySelectorAll("#provinces .selected").length === 1);

  // Second tap on an empty highlighted province is the whole order.
  document.querySelector("#provinces #gal").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => window.__calls.some((c) => c.url === "/order"), "POST /order");
  const posted = window.__calls.find((c) => c.url === "/order").body;
  check(
    "two-tap move body",
    JSON.stringify(posted) === JSON.stringify({ province: "vie", parts: ["Move", "gal"] }),
    JSON.stringify(posted)
  );
  await wait(() => document.querySelectorAll("#orders li").length === 1, "sidebar order");
  check("builder closed", document.getElementById("builder").hidden === true);
  check("posted order is reported in words",
        document.getElementById("status").textContent === "Vienna moves to Galicia.",
        document.getElementById("status").textContent);

  // An occupied reachable province raises the chip.
  const tapProvince = (id) => {
    const el = document.querySelector("#provinces #" + CSS.escape(id));
    const r = el.getBoundingClientRect();
    el.dispatchEvent(new MouseEvent("click", {
      bubbles: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }));
  };
  const chipButton = (label) => Array.from(document.querySelectorAll("#chip button"))
    .find((b) => b.textContent === label);
  // The unit is picked and no branch has been entered yet.
  const pickMode = () => /tap a green province to move there/.test(document.getElementById("status").textContent);

  tapProvince("vie");
  await wait(pickMode, "reachable set");
  check("an empty move target is plain green",
        document.querySelector("#provinces #gal").getAttribute("class") === "legal");
  tapProvince("bud");
  await wait(() => document.getElementById("chip"), "chip");
  check("chip offers both readings",
        Array.from(document.querySelectorAll("#chip button")).map((b) => b.textContent).join(",") === "Attack,Support,×",
        Array.from(document.querySelectorAll("#chip button")).map((b) => b.textContent).join(","));
  check("chip is anchored on screen", (() => {
    const r = document.getElementById("chip").getBoundingClientRect();
    return r.left >= 0 && r.top >= 0 && r.right <= window.innerWidth && r.bottom <= window.innerHeight;
  })());
  check("chip narrates the choice", /^Attack Army Budapest, or support it\?$/.test(document.getElementById("status").textContent),
        document.getElementById("status").textContent);

  // Support from the chip: highlight the supported unit's destinations.
  chipButton("Support").click();
  await wait(() => /Supporting/.test(document.getElementById("status").textContent), "support mode");
  const supLegal = Array.from(document.querySelectorAll("#provinces .legal")).map((e) => e.id).sort();
  check("only the supported unit and its destinations are lit",
        supLegal.join(",") === "bud,ser", supLegal.join(","));
  check("the supported unit is marked apart",
        document.querySelectorAll("#provinces .support-src").length === 1 &&
        document.querySelector("#provinces .support-src").id === "bud");
  check("support hint names both units",
        document.getElementById("status").textContent ===
          "Supporting Army Budapest — tap where you are helping it go, or tap Budapest again to back its hold.",
        document.getElementById("status").textContent);
  check("chip dismissed after picking", document.getElementById("chip") === null);
  tapProvince("ser");
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 2, "support POST");
  check("support-move via chip",
        JSON.stringify(window.__calls.filter((c) => c.url === "/order")[1].body) ===
          JSON.stringify({ province: "vie", parts: ["Support", "bud", "ser"] }),
        JSON.stringify(window.__calls.filter((c) => c.url === "/order")[1].body));

  // Support-hold: in support mode, tap the supported unit itself.
  tapProvince("vie");
  await wait(pickMode, "reachable set again");
  tapProvince("bud");
  await wait(() => document.getElementById("chip"), "chip again");
  chipButton("Support").click();
  await wait(() => /Supporting/.test(document.getElementById("status").textContent), "support mode again");
  tapProvince("bud");
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 3, "support-hold POST");
  check("support-hold via chip",
        JSON.stringify(window.__calls.filter((c) => c.url === "/order")[2].body) ===
          JSON.stringify({ province: "vie", parts: ["Support", "bud", "bud"] }),
        JSON.stringify(window.__calls.filter((c) => c.url === "/order")[2].body));

  // Attack from the chip is a plain move.
  tapProvince("vie");
  await wait(pickMode, "reachable set once more");
  tapProvince("bud");
  await wait(() => document.getElementById("chip"), "chip once more");
  chipButton("Attack").click();
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 4, "attack POST");
  check("attack via chip",
        JSON.stringify(window.__calls.filter((c) => c.url === "/order")[3].body) ===
          JSON.stringify({ province: "vie", parts: ["Move", "bud"] }),
        JSON.stringify(window.__calls.filter((c) => c.url === "/order")[3].body));

  // Escape backs out of support mode, then out of the order.
  tapProvince("vie");
  await wait(pickMode, "reachable set for escape");
  tapProvince("bud");
  await wait(() => document.getElementById("chip"), "chip for escape");
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  check("escape closes the chip first", document.getElementById("chip") === null &&
        document.getElementById("builder").hidden === false);
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  check("escape then closes the order", document.getElementById("builder").hidden === true);
  check("escape posted nothing", window.__calls.filter((c) => c.url === "/order").length === 4);

  // The Move button still works, and reaching it drops the shortcut.
  document.querySelector("#provinces #vie").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => buttonNamed("Move"), "options for vie");
  buttonNamed("Move").click();
  await wait(() => buttonNamed("TRI"), "move target buttons");
  const targets = Array.from(document.querySelectorAll("#builder-buttons button")).map((b) => b.textContent);
  check("SrcProvince auto-selected", targets.join(",") === "BUD,GAL,TRI", targets.join(","));
  buttonNamed("BUD").click();
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 5, "move-by-button POST");
  check(
    "move via buttons body",
    JSON.stringify(window.__calls.filter((c) => c.url === "/order")[4].body) ===
      JSON.stringify({ province: "vie", parts: ["Move", "bud"] })
  );

  // Hold from the bottom bar posts at once.
  document.querySelector("#provinces #vie").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => buttonNamed("Hold"), "options for vie");
  buttonNamed("Hold").click();
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 6, "hold POST");
  check(
    "hold body",
    JSON.stringify(window.__calls.filter((c) => c.url === "/order")[5].body) ===
      JSON.stringify({ province: "vie", parts: ["Hold"] })
  );
  await wait(() => document.getElementById("builder").hidden === true, "builder to close");
  check("builder closed after hold", document.getElementById("builder").hidden === true);

  // Double tapping a unit holds; double tapping open sea zooms.
  const doubleTap = async (x, y) => {
    const map = document.getElementById("map");
    for (let i = 0; i < 2; i++) {
      map.dispatchEvent(new PointerEvent("pointerdown", { pointerId: 20 + i, pointerType: "touch", clientX: x, clientY: y, bubbles: true }));
      map.dispatchEvent(new PointerEvent("pointerup", { pointerId: 20 + i, pointerType: "touch", clientX: x, clientY: y, bubbles: true }));
    }
  };
  const midOf = (id) => {
    const r = document.querySelector("#provinces #" + CSS.escape(id)).getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const vieMid = midOf("vie");
  await doubleTap(vieMid.x, vieMid.y);
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 7, "double tap hold POST");
  check(
    "double tap on unit posts Hold",
    JSON.stringify(window.__calls.filter((c) => c.url === "/order")[6].body) ===
      JSON.stringify({ province: "vie", parts: ["Hold"] })
  );
  check("double tap leaves no builder open", document.getElementById("builder").hidden === true);
  check("double tap reports it in words", document.getElementById("status").textContent === "Vienna holds.",
        document.getElementById("status").textContent);

  const zoomBefore = window.__app.getZoom();
  const sea = midOf("ser");   // no unit in this stub province
  await doubleTap(sea.x, sea.y);
  await wait(() => window.__app.getZoom() > zoomBefore, "double tap zoom off-unit");
  check("double tap off a unit zooms", window.__app.getZoom() > zoomBefore,
        zoomBefore.toFixed(2) + " → " + window.__app.getZoom().toFixed(2));
  check("no extra order from the zoom tap", window.__calls.filter((c) => c.url === "/order").length === 7);
  window.__app.resetView();
  await new Promise((r) => setTimeout(r, 320));   // let the gesture's click block lapse

  // A three-step support order, chosen by clicking the map instead of buttons.
  document.querySelector("#provinces #bud").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => /has no legal orders/.test(document.getElementById("status").textContent), "empty options");
  check("empty option tree handled", document.getElementById("builder").hidden === true);
  document.querySelector("#provinces #vie").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => buttonNamed("Support"), "options for vie again");
  buttonNamed("Support").click();
  await wait(() => buttonNamed("BUD"), "support source");
  buttonNamed("BUD").click();
  await wait(() => buttonNamed("SER"), "support target");
  document.querySelector("#provinces #ser").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  await wait(() => window.__calls.filter((c) => c.url === "/order").length === 8, "support-by-button POST");
  const support = window.__calls.filter((c) => c.url === "/order")[7].body;
  check(
    "support order body",
    JSON.stringify(support) === JSON.stringify({ province: "vie", parts: ["Support", "bud", "ser"] }),
    JSON.stringify(support)
  );

  // --- Order graphics and the clickable list.
  const graphic = (p) => document.querySelector('#order-overlay .order[data-province="' + p + '"]');
  // Put one of every order kind on the board at once.
  window.__setOrder("vie", ["Move", "tri"]);
  window.__setOrder("bud", ["Hold"]);
  window.__setOrder("tri", ["Support", "bud", "ser"]);
  window.__setOrder("ser", ["Support", "bud"]);
  window.__app.refresh();
  await wait(() => graphic("ser"), "all graphics");
  check("move graphic is one closed arrow outline", (() => {
    const g = graphic("vie");
    const poly = g && g.querySelector("polygon.order-line");
    const halo = g && g.querySelector("polygon.order-halo");
    // Shaft and head in a single 7-point polygon, with a dark twin behind it.
    return Boolean(poly && halo &&
      poly.getAttribute("points").trim().split(/\s+/).length === 7 &&
      halo.getAttribute("points") === poly.getAttribute("points") &&
      poly.getAttribute("fill") !== "none" &&
      parseFloat(halo.getAttribute("stroke-width")) > 0);
  })(), graphic("vie") ? graphic("vie").innerHTML.slice(0, 80) : "missing");
  check("arrow halo is painted before the colour", (() => {
    const kids = Array.from(graphic("vie").children).map((n) => n.getAttribute("class"));
    return kids.indexOf("order-halo") < kids.indexOf("order-line");
  })());
  check("hold graphic is a ring",
        Boolean(graphic("bud") && graphic("bud").querySelector("circle.order-line")));
  check("support-move graphic is a dashed curve", (() => {
    const path = graphic("tri") && graphic("tri").querySelector("path.order-line");
    return Boolean(path && path.getAttribute("stroke-dasharray") && /^M .* Q /.test(path.getAttribute("d")));
  })());
  check("support-hold graphic ends in an open circle",
        Boolean(graphic("ser") && graphic("ser").querySelector("path.order-line") &&
                graphic("ser").querySelector("circle.order-line")));
  check("every graphic has a dark halo under it",
        Array.from(document.querySelectorAll("#order-overlay .order"))
          .every((g) => g.querySelector(".order-halo") &&
            Array.from(g.children).map((n) => n.getAttribute("class")).lastIndexOf("order-halo") <
            Array.from(g.children).map((n) => n.getAttribute("class")).indexOf("order-line")));

  const beforeWidth = parseFloat(graphic("vie").querySelector(".order-halo").getAttribute("stroke-width"));
  const row = document.querySelector('#orders li[data-province="vie"]');
  check("orders list rows are pickable", Boolean(row));
  row.click();
  await wait(() => graphic("vie").classList.contains("hot"), "picked graphic");
  check("picking a row thickens its graphic",
        parseFloat(graphic("vie").querySelector(".order-halo").getAttribute("stroke-width")) > beforeWidth);
  check("picking a row dims the others",
        graphic("bud").classList.contains("dim") && graphic("ser").classList.contains("dim"));
  check("picked row is marked",
        document.querySelector('#orders li[data-province="vie"]').classList.contains("picked"));
  document.querySelector('#orders li[data-province="vie"]').click();
  await wait(() => !graphic("vie").classList.contains("hot"), "unpicked");
  check("clicking again clears the highlight",
        !graphic("bud").classList.contains("dim"));

  // --- Row actions: Change reopens ordering, x removes the order.
  const rowFor = (p) => document.querySelector('#orders li[data-province="' + p + '"]');
  const rowsBefore = document.querySelectorAll("#orders li").length;
  rowFor("bud").querySelector(".row-cancel").click();
  await wait(() => !rowFor("bud"), "row removed");
  check("cancel removes the row", document.querySelectorAll("#orders li").length === rowsBefore - 1);
  check("cancel removes the graphic", graphic("bud") === null);
  check("cancel posts an empty parts list", (() => {
    const last = window.__calls.filter((c) => c.url === "/order").pop().body;
    return JSON.stringify(last) === JSON.stringify({ province: "bud", parts: [] });
  })(), JSON.stringify(window.__calls.filter((c) => c.url === "/order").pop().body));
  check("cancel says which order went",
        document.getElementById("status").textContent === "Order for Budapest removed.",
        document.getElementById("status").textContent);
  check("cancel leaves no order builder open", document.getElementById("builder").hidden === true);

  const callsBeforeChange = window.__calls.filter((c) => c.url === "/order").length;
  rowFor("vie").querySelector(".row-change").click();
  await wait(() => !document.getElementById("builder").hidden, "builder reopened by Change");
  check("change cancels the old order first", (() => {
    const posted = window.__calls.filter((c) => c.url === "/order");
    return posted.length === callsBeforeChange + 1 &&
      JSON.stringify(posted[posted.length - 1].body) === JSON.stringify({ province: "vie", parts: [] });
  })());
  check("change reopens the unit with its move targets", pickMode() &&
        Array.from(document.querySelectorAll("#provinces .legal")).map((e) => e.id).sort().join(",") === "bud,gal,tri",
        Array.from(document.querySelectorAll("#provinces .legal")).map((e) => e.id).sort().join(","));
  check("change dropped the old row", rowFor("vie") === null);
  document.getElementById("builder-cancel").click();

  // Rebuild an order so adjudication has something to resolve.
  window.__setOrder("vie", ["Move", "tri"]);
  window.__app.refresh();
  await wait(() => rowFor("vie"), "order restored");

  document.getElementById("adjudicate").click();
  await wait(() => !document.getElementById("resolutions-pane").hidden, "resolutions");
  check("resolutions listed", document.querySelectorAll("#resolutions li").length === 1);
  check("adjudication clears the order graphics",
        document.querySelectorAll("#order-overlay .order").length === 0);

  check("no uncaught JS errors", window.__errors.length === 0, window.__errors.join(" | "));
}

run().then(
  () => finish(),
  (err) => {
    check("harness completed", false, String(err.message || err));
    finish();
  }
);

function finish() {
  window.__results = checks;
  window.__done = true;
  document.getElementById("results").textContent = checks.join("\n");
}
</script>
</body>
</html>
